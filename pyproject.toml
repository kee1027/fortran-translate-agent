[project]
name = "fortran-translate-agent"
version = "0.1.0"
description = "LangGraph-based Fortran code translation agent with compile-test-repair loop"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
