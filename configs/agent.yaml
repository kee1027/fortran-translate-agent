# Agent 环路护栏与执行参数（全部可调，勿硬编码）

llm:
  base_url: http://localhost:11434/v1
  # 本地开发默认使用当前 Ollama 模型；正式微调后替换为 fortran-translator:7b-q4
  model: qwen3.5:2b
  temperature: 0.2
  max_retries: 1                   # 结构化输出解析失败后的重试次数

agent:
  source_lang: fortran
  target_lang: cpp
  cpp_standard: c++17
  allow_third_party_libs: false    # MVP 只允许标准库
  supported_dialects: [f77, f90, f95]

loop:
  max_iterations: 5                # 最大修复轮次（硬上限）
  oscillation_similarity: 0.95     # 相邻两轮代码 diff 相似度超过该值视为震荡，提前终止
  error_history_window: 2          # repair prompt 中携带的最近错误轮数（防上下文膨胀）

sandbox:
  image: fortran-sandbox:latest
  timeout_seconds: 30
  memory_limit: 512m
  cpus: 1
  network: none                    # 断网执行

verify:
  rel_tolerance: 1.0e-9            # 数值等价相对误差容差
  abs_tolerance: 1.0e-12

eval:
  dataset_path: data/splits/
  output_dir: eval_results/
