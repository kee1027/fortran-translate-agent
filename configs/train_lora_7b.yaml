# LLaMA-Factory 7B bf16 LoRA 配置骨架
# 目标硬件：单张 A800 40GB
# 目标模型：Qwen2.5-Coder-7B-Instruct 级稠密模型
# 注意：数据文件需要先转换成 LLaMA-Factory 可识别的 ShareGPT/Alpaca 格式，
#       见 docs/04-training-manual.md。

### model
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
trust_remote_code: true
template: qwen

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
# 7B 稠密模型在 40GB 单卡上优先使用 bf16，不使用 4bit QLoRA。
quantization_bit: null

### data
dataset_dir: data
dataset: fortran_cpp_train
eval_dataset: fortran_cpp_val
cutoff_len: 4096
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 4
val_size: 0.0

### output
output_dir: outputs/qwen2.5-coder-7b-lora
overwrite_output_dir: true
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
report_to: none

### training
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
bf16: true
fp16: false
tf32: true
gradient_checkpointing: true
optim: adamw_torch
weight_decay: 0.0

### evaluation
do_eval: true
eval_strategy: steps
eval_steps: 200
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false

### runtime
ddp_timeout: 180000000
# 先单卡跑通。双卡时再切换为 DDP/DeepSpeed。
# deepspeed: configs/deepspeed_zero2.json
